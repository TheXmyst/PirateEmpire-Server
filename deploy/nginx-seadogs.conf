# Site nginx pour SeaDogs, à utiliser SEULEMENT si nginx occupe déjà les
# ports 80/443 sur le VPS (par exemple pour un autre jeu).
# À copier dans /etc/nginx/sites-available/seadogs, puis :
#   ln -s /etc/nginx/sites-available/seadogs /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d seadogs.duckdns.org
# certbot ajoute tout seul la partie HTTPS (port 443) et le renouvellement.
#
# Remplace le nom par ton adresse DuckDNS, et le port par celui de
# LISTEN_ADDR dans seadogs.env.
server {
    listen 80;
    listen [::]:80;
    server_name seadogs.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Le serveur lit l'IP du joueur ici (limite de tentatives de connexion).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
